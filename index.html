<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey You 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">


<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  backdrop-filter: blur(15px);
}

h1 {
  font-size: 2.5rem;
}

button {
  margin: 15px;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

#yes { background: #6366f1; color: white; }
#no { background: #ef4444; color: white; position: relative; }
</style>
</head>

<body>

<div class="card">
  <h1>Hey Baby 💙</h1>
  <p>I made something just for you ✨</p>
  <h2>Will you go out on a date with me?</h2>

  <button id="yes" onclick="yes()">Yes 💖</button>
  <button id="no" onmouseover="move()">No 😢</button>
</div>

<script>
function yes() {
  document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:20%;'>YAYYY 🎉💙 Can't wait!</h1>";
}

function move() {
  let btn = document.getElementById("no");
  let x = Math.random() * 200 - 100;
  let y = Math.random() * 100 - 50;
  btn.style.transform = `translate(${x}px, ${y}px)`;
}
</script>

</body>
</html>

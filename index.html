<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey You 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
  overflow: hidden;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 50px;
  border-radius: 20px;
  text-align: center;
  backdrop-filter: blur(15px);
  animation: fadeIn 1.5s ease;
}

h1 { font-size: 2.5rem; margin-bottom: 10px; }
h2 { margin-top: 15px; }

/* Buttons */
.buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 25px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

#yes {
  background: #6366f1;
  color: white;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: #ef4444;
  color: white;
  position: relative;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Hearts animation */
.heart {
  position: absolute;
  color: #ff6b81;
  animation: float 5s linear infinite;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey You 💙</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 50px;
  border-radius: 20px;
  text-align: center;
}

.buttons {
  margin-top: 20px;
}

button {
  padding: 12px 25px;
  margin: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

#yes { background: #6366f1; color: white; }
#no { background: #ef4444; color: white; }
</style>
</head>

<body>

<div class="card">
  <h1 id="typing">Hey Priya 💙</h1>
  <p>I made something just for you ✨</p>
  <h2>Will you go out on a date with me? 💖</h2>

  <div class="buttons">
    <button onclick="yesClicked()">Yes 💕</button>
    <button id="no" onmouseover="moveButton()">No 😢</button>
  </div>
</div>

<script>
function yesClicked() {
  document.body.innerHTML = "<h1 style='text-align:center;margin-top:20%'>YAYYY 🎉💖</h1>";
}

function moveButton() {
  let btn = document.getElementById("no");
  let x = Math.random() * 200 - 100;
  let y = Math.random() * 100 - 50;
  btn.style.transform = `translate(${x}px, ${y}px)`;
}
</script>

</body>
</html>
